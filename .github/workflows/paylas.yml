name: Paylas

on:
  schedule:
    - cron: "23,53 * * * *"   # saatte iki kez (yoğun olmayan dakikalar); zamanı gelen gönderi varsa paylaşır
  workflow_dispatch:
    inputs:
      deneme:
        description: "Deneme (hiçbir şey paylaşmadan anahtarı kontrol et)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: paylas
  cancel-in-progress: false

jobs:
  paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Paylas
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.deneme }}" = "true" ]; then
            python paylas.py --deneme
          else
            python paylas.py
          fi
      - name: Durumu kaydet
        if: always()
        run: |
          if [ -n "$(git status --porcelain durum.json)" ]; then
            git config user.name "paylasim-botu"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add durum.json
            git commit -m "Paylasim durumu"
            git push
          fi
